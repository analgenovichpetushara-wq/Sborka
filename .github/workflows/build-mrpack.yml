name: Build NEON TOKYO mrpack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build mrpack
        run: python tools/build_mrpack.py
      - name: Commit generated pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modrinth.index.json NEON-TOKYO-1.0.0.mrpack build-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: NEON TOKYO mrpack [skip ci]'
          git push
